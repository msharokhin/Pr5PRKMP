dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Пути обновлены
  assets:
    - assets/pr2.jpg
    - assets/580.jpg
    - assets/4070.jpg
    - assets/4080.jpeg
    - assets/5090.jpg
    - assets/7900.jpg

  # Регистрируем скачанный шрифт в системе
  fonts:
